              schema:
                type: string

  /api/jury/talks/{id}/presentation:
    get:
      tags: [jury]
      summary: Скачать презентацию заявки
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Файл презентации
          headers:
            Content-Disposition:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string

  /api/jury/talks/{id}/review:
    patch:
      tags: [jury]
      summary: Решение жюри
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [approved, rejected, needs_revision]
                  example: "approved"
                juryComment:
                  type: string
                  description: Обязателен для rejected и needs_revision
                  example: "Работа рекомендована к очному докладу."
                roomId:
                  type: integer
                  description: Обязателен для approved (1 - Ауд. 101, 2 - Ауд. 204, 3 - Ауд. 305, 4 - Конференц-зал)
                  example: 1
                startTime:
                  type: string
                  format: date-time
                  description: Обязателен для approved (ISO 8601)
                  example: "2026-10-20T10:00:00+06:00"
                endTime:
                  type: string
                  format: date-time
                  description: Обязателен для approved (ISO 8601)
                  example: "2026-10-20T10:15:00+06:00"
            examples:
              approved:
                summary: Одобрение с аудиторией и временем
                value:
                  status: "approved"
                  roomId: 1
                  startTime: "2026-10-20T10:00:00+06:00"
                  endTime: "2026-10-20T10:15:00+06:00"
                  juryComment: "Работа одобрена, назначено время доклада."
              needs_revision:
                summary: Возврат на доработку с комментарием
                value:
                  status: "needs_revision"
                  juryComment: "Пожалуйста, расширьте аннотацию и опишите практическую ценность проекта."
              rejected:
                summary: Отклонение заявки
                value:
                  status: "rejected"
                  juryComment: "Тема работы не соответствует выбранной секции конференции."
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Talk'
        '409':
          description: Конфликт расписания (SCHEDULE_CONFLICT)

  /api/admin/users:
    post:
      tags: [admin]
      summary: Создать пользователя
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, role]
              properties:
                fullName:
                  type: string
                  example: "Асанов Асан Асанович"
                groupName:
                  type: string
                  example: "ИС-21"
                role:
                  type: string
                  enum: [student, jury, admin]
                  example: "student"
                login:
                  type: string
                  description: Для студентов генерируется автоматически (для jury/admin можно указать свой)
                  example: "asanov"
            example:
              fullName: "Асанов Асан Асанович"
              groupName: "ИС-21"
              role: "student"
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/UserPublic'
                  tempPassword:
                    type: string
                    description: Показывается один раз
    get:
      tags: [admin]
      summary: Список пользователей
      security:
        - BearerAuth: []
      parameters:
        - name: role
          in: query
          schema:
            type: string
            example: "student"
        - name: q
          in: query
          schema:
            type: string
            example: "Асанов"
        - name: isActive
          in: query
          schema:
            type: boolean
            example: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserPublic'

  /api/admin/users/import:
    post:
      tags: [admin]
      summary: Импорт пользователей из CSV
      description: |
        CSV с заголовком fullName,groupName (опционально role,login).
        Роль по умолчанию student. ?format=csv для скачивания результата.
      security:
        - BearerAuth: []
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
            example: "json"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'

